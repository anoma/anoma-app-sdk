name: publish-arm-bindings

# Driven by release-please once it has cut an arm-bindings release; also
# runnable by hand for a rehearsal. Everything is built from source here, since
# neither generated/ nor the native halves are committed.
on:
  workflow_call:
    inputs:
      dry-run:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Pack and verify without publishing"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish-arm-bindings
  cancel-in-progress: false

jobs:
  # Cheaper to fail here than after three platform builds.
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-js

      - name: Check version is unpublished
        working-directory: arm-bindings
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already published. Bump the version first."
            exit 1
          fi
          echo "publishing $name@$version"

  build:
    needs: guard
    uses: ./.github/workflows/build-arm-bindings.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # npm provenance attestation. Scoped to this job so the builds cannot
      # mint one.
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-js
        with:
          registry-url: "https://registry.npmjs.org"

      # The tarball the build job packed and verified, published verbatim, so
      # what ships is the artefact that passed the checks.
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: arm-bindings-package
          path: ${{ runner.temp }}/package

      - name: Publish
        run: |
          tarball=$(ls "$RUNNER_TEMP"/package/*.tgz)
          echo "publishing $(basename "$tarball")"
          if [ "${{ inputs.dry-run }}" = "true" ]; then
            npm publish --dry-run "$tarball"
          else
            npm publish "$tarball"
          fi
