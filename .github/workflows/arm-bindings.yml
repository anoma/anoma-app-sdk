name: arm-bindings

on:
  pull_request:
    paths:
      - "arm-bindings/**"
      - "patches/**"
      - ".github/workflows/arm-bindings.yml"
  push:
    branches:
      - main
    paths:
      - "arm-bindings/**"
      - "patches/**"
      - ".github/workflows/arm-bindings.yml"

permissions:
  contents: read

concurrency:
  group: arm-bindings-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Separate job so a formatting slip fails in seconds, not behind the build.
  rustfmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rustfmt
        working-directory: arm-bindings/rust
        run: cargo fmt --check

  web:
    runs-on: ubuntu-latest
    # Cold risc0 builds are slow; the cache turns this into a few minutes.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # rust_modules holds ubrn's generated wrapper crate, where the expensive
      # wasm build actually happens.
      - name: Restore cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            arm-bindings/rust/target
            arm-bindings/rust_modules/wasm/target
          key: cargo-web-${{ hashFiles('arm-bindings/rust/Cargo.lock') }}
          restore-keys: cargo-web-

      # rust-toolchain.toml pins the channel and targets; fail here, not mid-build.
      - name: Install Rust toolchain
        working-directory: arm-bindings/rust
        run: rustup show active-toolchain

      # Host target: for wasm32 uniffi_core needs its
      # wasm-unstable-single-threaded feature, which only ubrn's wrapper enables.
      - name: Clippy
        working-directory: arm-bindings
        run: pnpm lint:rust

      # ubrn calls `wasm-bindgen` directly and never wasm-pack, so nothing else
      # puts this on PATH. Must match the crate pinned in wasm-cargo-patch.toml.
      - name: Install wasm-bindgen CLI
        run: |
          if ! wasm-bindgen --version 2>/dev/null | grep -q '0\.2\.127'; then
            cargo install wasm-bindgen-cli --locked --version 0.2.127
          fi

      # Supplies wasm-opt.
      - name: Install binaryen
        run: sudo apt-get update && sudo apt-get install -y binaryen

      - name: Build
        working-directory: arm-bindings
        run: pnpm build

      # Only possible once generated/ exists.
      - name: TypeScript (bindings)
        working-directory: arm-bindings
        run: pnpm typecheck

      # Loads dist/ as a consumer would: covers the wasm lookup and files list.
      - name: Smoke test
        working-directory: arm-bindings
        run: pnpm smoke

      # Packs for real so the tarball can be downloaded and tried; also checks
      # the files list resolves.
      - name: Pack
        working-directory: arm-bindings
        run: npm pack

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arm-bindings
          path: arm-bindings/*.tgz
          retention-days: 14
