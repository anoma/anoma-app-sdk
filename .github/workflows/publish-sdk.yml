name: publish-sdk

# Driven by release-please once it has cut an SDK release; also runnable by hand
# for a rehearsal.
on:
  workflow_call:
    inputs:
      dry-run:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Pack and verify without publishing"
        type: boolean
        default: true

permissions:
  contents: read
  # npm provenance attestation.
  id-token: write

concurrency:
  group: publish-sdk
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Cheaper to fail here than on the publish call.
      - name: Check version is unpublished
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already published. Bump the version first."
            exit 1
          fi
          echo "publishing $name@$version"

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test:run

      - name: Publish
        run: |
          if [ "${{ inputs.dry-run }}" = "true" ]; then
            npm publish --dry-run
          else
            npm publish
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_ACCESS_TOKEN }}
