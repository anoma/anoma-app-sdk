name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-js

      - name: Prettier
        run: pnpm format:check

      - name: ESLint
        run: pnpm lint

      - name: TypeScript
        run: pnpm tsc-check

      - name: Tests
        run: pnpm test:run

      # Exercises tsdown on every PR; `build` also packs the tarball.
      - name: Build
        run: pnpm build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: anoma-app-sdk
          path: package/*.tgz
          retention-days: 14

      # Installable build per commit, so the app can test before a release.
      - name: Preview release
        run: npx pkg-pr-new publish './package/*.tgz'
