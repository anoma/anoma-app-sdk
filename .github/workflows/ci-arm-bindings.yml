name: ci-arm-bindings

on:
  pull_request:
    paths:
      - "arm-bindings/**"
      - "patches/**"
      - ".github/actions/setup-rust-toolchain/**"
      - ".github/workflows/build-arm-bindings.yml"
      - ".github/workflows/ci-arm-bindings.yml"
  push:
    branches:
      - main
    paths:
      - "arm-bindings/**"
      - "patches/**"
      - ".github/actions/setup-rust-toolchain/**"
      - ".github/workflows/build-arm-bindings.yml"
      - ".github/workflows/ci-arm-bindings.yml"

permissions:
  contents: read

concurrency:
  group: ci-arm-bindings-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Exactly what a release builds, so a green PR means a publishable package.
  build:
    uses: ./.github/workflows/build-arm-bindings.yml
    with:
      preview: true
