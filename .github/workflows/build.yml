name: Build Anoma App SDK
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CI: false
jobs:
  build-sdk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install npm dependencies
        uses: ./.github/actions/prepare-pnpm

      - name: Install Rust dependencies
        uses: ./.github/actions/prepare-rust

      - name: Lint source check
        run: pnpm lint

      - name: Build the SDK
        run: pnpm build

      - name: Run SDK unit tests
        run: pnpm test

      - name: Pack the SDK
        run: pnpm pack:ci

      - uses: actions/upload-artifact@v4
        with:
          name: anoma-app-sdk package archive
          path: ./package/anomaorg-anoma-app-sdk-*.tgz
