name: setup-js
description: Install pnpm and Node, then the workspace dependencies.

inputs:
  registry-url:
    description: npm registry to authenticate against. Set only when publishing.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24.x
        cache: pnpm
        registry-url: ${{ inputs.registry-url }}

    - shell: bash
      run: pnpm install --frozen-lockfile
