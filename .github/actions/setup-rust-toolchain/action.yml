name: setup-rust-toolchain
description: Rust plus the tools the arm-bindings build shells out to.

runs:
  using: composite
  steps:
    # rust_modules holds ubrn's generated wrapper crate, where the wasm build
    # actually happens.
    - name: Restore cargo cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/bin
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          arm-bindings/rust/target
          arm-bindings/rust_modules/wasm/target
        key: cargo-${{ runner.os }}-${{ hashFiles('arm-bindings/rust/Cargo.lock') }}
        restore-keys: cargo-${{ runner.os }}-

    # rust-toolchain.toml pins the channel and targets; fail here, not mid-build.
    - name: Install Rust toolchain
      working-directory: arm-bindings/rust
      shell: bash
      run: rustup show active-toolchain

    # ubrn calls `wasm-bindgen` directly and never wasm-pack, so nothing else
    # puts this on PATH. The version is read from the crate pin rather than
    # repeated here, so the CLI and the crate cannot drift apart.
    - name: Install wasm-bindgen CLI
      shell: bash
      run: |
        version=$(sed -n 's/^wasm-bindgen = "=\(.*\)"$/\1/p' arm-bindings/wasm-cargo-patch.toml)
        if [ -z "$version" ]; then
          echo "no pinned wasm-bindgen version in arm-bindings/wasm-cargo-patch.toml"
          exit 1
        fi
        if ! wasm-bindgen --version 2>/dev/null | grep -qF "$version"; then
          cargo install wasm-bindgen-cli --locked --version "$version"
        fi

    # `ubrn build android` runs `cargo ndk` per target rather than cargo itself.
    # ANDROID_NDK_HOME is preset by the image and left alone, since
    # ANDROID_NDK_LATEST_HOME moves whenever the image is rebuilt.
    - name: Install cargo-ndk
      shell: bash
      env:
        CARGO_NDK_VERSION: "4.1.2"
      run: |
        if ! cargo ndk --version 2>/dev/null | grep -qF "$CARGO_NDK_VERSION"; then
          cargo install cargo-ndk --locked --version "$CARGO_NDK_VERSION"
        fi
