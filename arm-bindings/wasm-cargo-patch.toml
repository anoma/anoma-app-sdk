# TOML-merged over ubrn's generated wrapper manifest in rust_modules/wasm/,
# patch wins. See `wasm.manifestPatchFile` in ubrn.config.yaml.

[dependencies]
# ubrn's template leaves this as "*". rust_modules/ is gitignored and
# regenerated on every CI run, so an unpinned crate can outrun the
# wasm-bindgen CLI installed in the workflow and fail on a schema mismatch.
# setup-rust-toolchain reads the CLI version from this line, so the two
# cannot drift; bumping it here is enough.
wasm-bindgen = "=0.2.127"

# Does what wasm-opt -Oz used to, 6KB better over the wire and without a
# platform-specific binary in CI. opt-level stays at ubrn's 3: the merge
# rejects a string over an integer, and "z" is what these recover anyway.
# `panic` is deliberately left alone — uniffi's scaffolding catches unwinds
# to turn panics into errors.
[profile.release]
lto = true
codegen-units = 1
strip = true
