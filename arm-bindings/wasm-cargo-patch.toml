# TOML-merged over ubrn's generated wrapper manifest in rust_modules/wasm/,
# patch wins. See `wasm.manifestPatchFile` in ubrn.config.yaml.

[dependencies]
# ubrn runs wasm-bindgen in-process, so the schema the CLI speaks is whatever
# `wasm-bindgen-cli-support` uniffi-bindgen-react-native pins in its Cargo.toml.
# ubrn's template leaves this "*", which resolves to latest and fails the schema
# check; it must match that pin exactly.
wasm-bindgen = "=0.2.100"

# Does what wasm-opt -Oz used to, 6KB better over the wire and without a
# platform-specific binary in CI. Measured: these two are worth 4.5KB gzipped
# at no build-time cost, while lto adds 35 bytes. opt-level stays at ubrn's 3,
# since the merge rejects a string over an integer. `panic` is left alone —
# uniffi's scaffolding catches unwinds to turn panics into errors.
[profile.release]
codegen-units = 1
strip = true
